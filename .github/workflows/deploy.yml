name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Bundles the Firebase SDK and all of src/ into one dist/app.js
      # instead of the browser fetching a dozen small files (several of
      # them live from Google's CDN) on every cold load.
      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Stamp this deploy's commit SHA into the service worker's cache
      # name, so every deploy evicts whatever the last one cached instead
      # of a phone holding onto old files until it happens to notice.
      - name: Stamp service worker cache version
        run: sed -i "s/__BUILD_ID__/${GITHUB_SHA::7}/" sw.js

      # Cloud Functions (the push-notification fan-out in functions/) needs
      # Firebase's Blaze plan, which isn't turned on yet — see functions/README
      # or the main README's "About Cloud Messaging and cost" section. Once
      # Blaze is on, change --only below back to "hosting,firestore" plus
      # ",functions" (or just run a plain `deploy` with nothing excluded).
      - name: Deploy (hosting, firestore rules)
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only hosting,firestore --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
